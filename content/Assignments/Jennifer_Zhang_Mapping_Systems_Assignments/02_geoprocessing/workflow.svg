<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Daily route and NYC public Wi-Fi geoprocessing workflow</title>
  <desc id="desc">A personal route and cleaned public Wi-Fi points are validated, projected, buffered, spatially intersected, nearest-joined, sampled, and exported as enriched GeoJSON, maps, a profile, and an audit.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .box { rx: 14; ry: 14; stroke-width: 2; }
      .label { font: 600 16px system-ui, -apple-system, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 13px system-ui, -apple-system, sans-serif; fill: #334155; text-anchor: middle; }
      .arrow { stroke: #475569; stroke-width: 2.25; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="360" fill="#f8fafc"/>

  <rect class="box" x="20" y="40" width="205" height="86" fill="#ffe4e6" stroke="#e11d48"/>
  <text class="label" x="122" y="72">Daily mental map</text>
  <text class="small" x="122" y="96">route + 4 public stops</text>
  <text class="small" x="122" y="114">EPSG:4326 GeoJSON</text>

  <rect class="box" x="20" y="228" width="205" height="86" fill="#ccfbf1" stroke="#0f766e"/>
  <text class="label" x="122" y="260">NYC public Wi-Fi</text>
  <text class="small" x="122" y="284">3,319 cleaned Points</text>
  <text class="small" x="122" y="302">published inventory</text>

  <path class="arrow" d="M225 83 C258 83 252 167 282 167"/>
  <path class="arrow" d="M225 271 C258 271 252 189 282 189"/>

  <rect class="box" x="284" y="132" width="175" height="90" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="371" y="165">Validate</text>
  <text class="small" x="371" y="188">schema · IDs · CRS</text>
  <text class="small" x="371" y="207">geometry · privacy</text>

  <path class="arrow" d="M459 177 L500 177"/>
  <rect class="box" x="502" y="132" width="170" height="90" fill="#fef3c7" stroke="#d97706"/>
  <text class="label" x="587" y="165">Project</text>
  <text class="small" x="587" y="190">EPSG:4326 → 2263</text>
  <text class="small" x="587" y="208">metric calculations</text>

  <path class="arrow" d="M672 177 C701 177 695 82 724 82"/>
  <path class="arrow" d="M672 177 L724 177"/>
  <path class="arrow" d="M672 177 C701 177 695 272 724 272"/>

  <rect class="box" x="726" y="37" width="210" height="90" fill="#dbeafe" stroke="#2563eb"/>
  <text class="label" x="831" y="69">Buffer + intersect</text>
  <text class="small" x="831" y="94">250 m route corridor</text>
  <text class="small" x="831" y="112">local Wi-Fi subset</text>

  <rect class="box" x="726" y="132" width="210" height="90" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="label" x="831" y="164">Nearest join</text>
  <text class="small" x="831" y="189">record + distance per stop</text>
  <text class="small" x="831" y="207">250 m stop counts</text>

  <rect class="box" x="726" y="227" width="210" height="90" fill="#dcfce7" stroke="#16a34a"/>
  <text class="label" x="831" y="259">Sample route</text>
  <text class="small" x="831" y="284">Point every 25 m</text>
  <text class="small" x="831" y="302">nearest-distance profile</text>

  <path class="arrow" d="M936 82 C970 82 966 165 998 165"/>
  <path class="arrow" d="M936 177 L998 177"/>
  <path class="arrow" d="M936 272 C970 272 966 189 998 189"/>

  <rect class="box" x="1000" y="117" width="185" height="120" fill="#fce7f3" stroke="#be185d"/>
  <text class="label" x="1092" y="151">Relate + interpret</text>
  <text class="small" x="1092" y="176">route corridor</text>
  <text class="small" x="1092" y="197">nearest connections</text>
  <text class="small" x="1092" y="218">citywide/local context</text>

  <path class="arrow" d="M1185 177 L1225 177"/>
  <rect class="box" x="1227" y="117" width="153" height="120" fill="#e2e8f0" stroke="#475569"/>
  <text class="label" x="1303" y="151">Outputs</text>
  <text class="small" x="1303" y="176">enriched GeoJSON</text>
  <text class="small" x="1303" y="197">map + profile</text>
  <text class="small" x="1303" y="218">QA audit</text>
</svg>
